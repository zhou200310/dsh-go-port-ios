name: iOS Probe Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ios-probe.yml'

jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Show Xcode
        run: |
          xcodebuild -version
          ls /Applications | grep -i xcode || true
          xcrun --sdk iphoneos --show-sdk-version

      - name: Flutter doctor
        run: |
          flutter --version
          flutter doctor -v

      - name: Generate iOS platform
        working-directory: app
        run: |
          set -e
          echo "=== 生成 ios/ 骨架 ==="
          # flutter create 会重写 pubspec.lock，可能把 connectivity_plus 拉回 7.3.2。
          # 先备份我们改好的 lockfile。
          cp pubspec.lock /tmp/lockfile.fixed
          flutter create --platforms=ios --org io.github.ccch1mneyyy --project-name dsh_app . 2>&1 | tail -20
          echo "=== 恢复修好的 lockfile ==="
          cp /tmp/lockfile.fixed pubspec.lock
          echo "=== 确认版本 ==="
          grep -A7 "^  connectivity_plus:" pubspec.lock | head -8
          echo "=== ios/ 内容 ==="
          ls -la ios/ || echo "无 ios 目录"

      - name: Pub get (enforce lockfile)
        working-directory: app
        run: |
          set -e
          flutter pub get --enforce-lockfile 2>&1 | tail -30
          echo "=== 解析后实际版本 ==="
          python3 - <<'PYEOF'
          import re
          txt = open('pubspec.lock').read()
          m = re.search(r'  connectivity_plus:\n(?:.*\n)*?    version: "([^"]+)"', txt)
          print("connectivity_plus lock version:", m.group(1) if m else "NOT FOUND")
          PYEOF
          echo "=== pub cache 里的 connectivity_plus 目录 ==="
          ls ~/.pub-cache/hosted/pub.dev/ | grep connectivity || true

      - name: Build iOS (expect failures — collect them)
        working-directory: app
        continue-on-error: true
        run: |
          set +e
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/build.log
          echo "EXIT=$?" | tee -a /tmp/build.log

      - name: Extract errors
        if: always()
        run: |
          echo "======== 错误汇总 ========"
          grep -iE "error|Error:" /tmp/build.log 2>/dev/null | head -60 || echo "(无 build.log)"
          echo
          echo "======== 末尾 80 行 ========"
          tail -80 /tmp/build.log 2>/dev/null || true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-probe-log
          path: /tmp/build.log
          retention-days: 14
          if-no-files-found: warn
