name: iOS Probe Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ios-probe.yml'

jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Show Xcode
        run: |
          xcodebuild -version
          ls /Applications | grep -i xcode || true
          xcrun --sdk iphoneos --show-sdk-version

      - name: Flutter doctor
        run: |
          flutter --version
          flutter doctor -v

      - name: Purge stale pub cache entry
        run: |
          set -e
          # 双保险：清掉 pub cache 里的 7.3.2，避免任何路径再拉到它
          rm -rf ~/.pub-cache/hosted/pub.dev/connectivity_plus-7.3.2 || true
          echo "=== 剩余 connectivity 缓存 ==="
          ls ~/.pub-cache/hosted/pub.dev/ | grep connectivity || echo "(空)"

      - name: Generate iOS platform
        working-directory: app
        run: |
          set -e
          echo "=== 生成 ios/ 骨架 ==="
          flutter create --platforms=ios --org io.github.ccch1mneyyy --project-name dsh_app . 2>&1 | tail -15
          echo "=== ios/ 内容 ==="
          ls -la ios/ || echo "无 ios 目录"

      - name: Pub get (fresh resolve)
        working-directory: app
        run: |
          set -e
          # 删掉 lock 让 pub 完全重新解析：
          # 手工改 lock 会导致 "Unable to satisfy pubspec.yaml using pubspec.lock"，
          # 且部分依赖的旧记录残留会让新版本无法落地。
          rm -f pubspec.lock
          flutter pub get 2>&1 | tail -30
          echo "=== lock 解析结果 ==="
          python3 - <<'PYEOF'
          import re
          txt = open('pubspec.lock').read()
          m = re.search(r'  connectivity_plus:\n(?:.*\n)*?    version: "([^"]+)"', txt)
          print("connectivity_plus =", m.group(1) if m else "NOT FOUND")
          assert m and m.group(1).startswith("7.0"), "版本仍未降下来！"
          PYEOF

      - name: Build iOS (expect failures — collect them)
        working-directory: app
        continue-on-error: true
        run: |
          set +e
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/build.log
          echo "EXIT=$?" | tee -a /tmp/build.log

      - name: Extract errors
        if: always()
        run: |
          echo "======== 错误汇总 ========"
          grep -iE "error|Error:" /tmp/build.log 2>/dev/null | head -60 || echo "(无 build.log)"
          echo
          echo "======== 末尾 80 行 ========"
          tail -80 /tmp/build.log 2>/dev/null || true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-probe-log
          path: /tmp/build.log
          retention-days: 14
          if-no-files-found: warn
