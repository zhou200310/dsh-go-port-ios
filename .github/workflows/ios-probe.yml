name: iOS Probe Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ios-probe.yml'

jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Flutter doctor
        run: |
          flutter --version
          flutter doctor -v

      - name: Generate iOS platform
        working-directory: app
        run: |
          set -e
          echo "=== 生成 ios/ 骨架 ==="
          flutter create --platforms=ios --org io.github.ccch1mneyyy --project-name dsh_app . 2>&1 | tail -20
          echo "=== 生成的 ios/ 内容 ==="
          ls -la ios/ || echo "无 ios 目录"

      - name: Pub get
        working-directory: app
        run: |
          set -e
          flutter pub get 2>&1 | tail -30

      - name: Build iOS (expect failures — collect them)
        working-directory: app
        continue-on-error: true
        run: |
          set +e
          flutter build ios --release --no-codesign 2>&1 | tee /tmp/build.log
          echo "EXIT=$?" | tee -a /tmp/build.log

      - name: Extract errors
        if: always()
        run: |
          echo "======== 错误汇总 ========"
          grep -iE "error|Error:" /tmp/build.log 2>/dev/null | head -60 || echo "(无 build.log)"
          echo
          echo "======== 末尾 80 行 ========"
          tail -80 /tmp/build.log 2>/dev/null || true

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-probe-log
          path: /tmp/build.log
          retention-days: 14
          if-no-files-found: warn
