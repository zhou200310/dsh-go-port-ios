name: iOS Probe Build

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/ios-probe.yml'

jobs:
  probe:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.9'
          cache: true

      - name: Show Xcode
        run: |
          xcodebuild -version
          ls /Applications | grep -i xcode || true
          xcrun --sdk iphoneos --show-sdk-version

      - name: Flutter doctor
        run: |
          flutter --version
          flutter doctor -v

      - name: Generate iOS platform
        working-directory: app
        run: |
          set -e
          echo "=== 生成 ios/ 骨架 ==="
          flutter create --platforms=ios --org io.github.ccch1mneyyy --project-name dsh_app . 2>&1 | tail -15
          echo "=== ios/ 内容 ==="
          ls -la ios/ || echo "无 ios 目录"

      - name: Pub get
        working-directory: app
        run: |
          set -e
          flutter pub get 2>&1 | tail -30
          echo "=== lock 解析结果 ==="
          python3 - <<'PYEOF'
          import re
          txt = open('pubspec.lock').read()
          m = re.search(r'  connectivity_plus:\n(?:.*\n)*?    version: "([^"]+)"', txt)
          v = m.group(1) if m else "NOT FOUND"
          print("connectivity_plus =", v)
          # 7.2.0/7.3.x 用了 iOS 26 的 NWPath.isUltraConstrained，macos-15 的 Xcode 16 没有这个 API
          assert v == "7.0.0", f"connectivity_plus 版本异常: {v}，必须锁 7.0.0"
          PYEOF

      - name: Build iOS unsigned
        working-directory: app
        run: |
          set -e
          flutter build ios --release --no-codesign 2>&1 | tail -60

      - name: Pack unsigned ipa
        run: |
          set -e
          app="$(find app/build/ios/iphoneos -maxdepth 1 -name '*.app' | head -1)"
          test -n "$app" || { echo "未找到 .app"; exit 1; }
          echo "app = $app"
          plutil -p "$app/Info.plist" | grep -E 'CFBundleIdentifier|MinimumOSVersion' || true
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$app" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && /usr/bin/ditto -c -k --keepParent Payload "$RUNNER_TEMP/dsh-go-unsigned.ipa")
          ls -lh "$RUNNER_TEMP/dsh-go-unsigned.ipa"

      - name: Upload unsigned ipa
        uses: actions/upload-artifact@v4
        with:
          name: dsh-go-unsigned-ipa
          path: ${{ runner.temp }}/dsh-go-unsigned.ipa
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
